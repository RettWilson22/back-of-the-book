# A plain, classic look: paper background, serif headings, square corners, link-blue accents.
[theme]
base = "light"
primaryColor = "#2a6496"
backgroundColor = "#f6f3ec"
secondaryBackgroundColor = "#ebe5d8"
textColor = "#222222"
linkColor = "#1a5ea8"
linkUnderline = true
borderColor = "#cfc6b4"
showWidgetBorder = true
font = "Helvetica Neue, Helvetica, Arial, sans-serif"
headingFont = "Georgia, Times New Roman, serif"
baseRadius = "3px"
buttonRadius = "3px"

[theme.sidebar]
backgroundColor = "#ebe5d8"

[server]
enableStaticServing = true
# Megabytes per uploaded file. The app also checks this, and limits pages and files.
maxUploadSize = 10

[client]
toolbarMode = "minimal"
